team: shop

api:
  replicas: 3
  image:
    repository: registry.shop.local/shop/api
    tag: "0.3.0"
    pullPolicy: IfNotPresent
  healthFail: false
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  spread:
    mode: topologySpreadConstraints
    topologyKey: kubernetes.io/hostname
    strict: true
    maxSkew: 1
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 300m, memory: 192Mi}

worker:
  replicas: 2
  image:
    repository: registry.shop.local/shop/worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  healthFail: false
  resources:
    requests: {cpu: 25m, memory: 48Mi}
    limits: {cpu: 150m, memory: 96Mi}

batch:
  replicas: 1
  image:
    repository: registry.shop.local/shop/batch
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  terminationGracePeriodSeconds: 5
  load:
    memoryMb: 200
    cpuWorkers: 1
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 500m, memory: 384Mi}

postgres:
  instances: 1
  storage:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

db:
  host: shop-postgres-rw
  port: "5432"
  name: app
  user: app
  passwordSecret: shop-postgres-app

monitoring:
  enabled: true
  releaseLabel: monitoring
  interval: 15s
  dashboard: true
  alerts:
    apiErrorRatio: 0.05
    apiErrorRatioFor: 2m
    apiDownFor: 1m
    ordersStuckWindow: 5m
    ordersStuckFor: 2m
