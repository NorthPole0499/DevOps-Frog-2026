apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-critical-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: api-critical
      rules:

        - alert: APIServiceDown
          expr: up{job="api-api"} == 0
          for: 1m
          labels:
            severity: critical
            service: api-api
          annotations:
            summary: "API service is down"
            description: "Prometheus cannot scrape the API service for more than 1 minute."

        - alert: APIHighErrorRate
          expr: |
            (
              sum(rate(http_request_errors_total{namespace="api-lab"}[5m]))
              /
              sum(rate(http_requests_total{namespace="api-lab"}[5m]))
            ) > 0.05
          for: 2m
          labels:
            severity: critical
            service: api-api
          annotations:
            summary: "API error rate is above 5%"
            description: "More than 5% of API requests have been failing for 2 minutes."

        - alert: APIHighLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{namespace="api-lab"}[5m])
              )
            ) > 2
          for: 3m
          labels:
            severity: critical
            service: api-api
          annotations:
            summary: "API p95 latency is above 2 seconds"
            description: "API p95 request latency has exceeded 2 seconds for 3 minutes."

        - alert: APITargetMissing
          expr: absent(up{job="api-api"})
          for: 1m
          labels:
            severity: critical
            service: api-api
          annotations:
            summary: "API Prometheus target is missing"
            description: "The API target is absent from Prometheus."