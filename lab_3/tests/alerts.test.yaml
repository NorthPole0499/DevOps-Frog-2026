rule_files: [rules.yaml]
evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      - series: 'http_requests_total{namespace="shop",job="api",pod="a",method="GET",path="/orders",status="200"}'
        values: '0+10x40'
      - series: 'http_requests_total{namespace="shop",job="api",pod="a",method="GET",path="/orders",status="503"}'
        values: '0+2x40'
      - series: 'http_requests_total{namespace="shop",job="api",pod="a",method="GET",path="/health",status="200"}'
        values: '0+100x40'
    alert_rule_test:
      - {eval_time: 1m, alertname: ShopApiHighErrorRatio, exp_alerts: []}
      - eval_time: 5m
        alertname: ShopApiHighErrorRatio
        exp_alerts:
          - exp_labels: {severity: critical, service: api, namespace: shop}
            exp_annotations:
              summary: "api: 16.67% запросов заканчиваются 5xx"
              description: "Больше 5% пользовательских запросов к api отвечают 5xx дольше 2m. Чаще всего это недоступный Postgres (api отвечает 503 «database unavailable»): kubectl get cluster -n shop."

  - interval: 15s
    input_series:
      - series: 'http_requests_total{namespace="shop",job="api",pod="a",method="GET",path="/orders",status="200"}'
        values: '0+10x40'
    promql_expr_test:
      - expr: shop:api_http_error_ratio:rate2m
        eval_time: 5m
        exp_samples:
          - {labels: 'shop:api_http_error_ratio:rate2m', value: 0}
    alert_rule_test:
      - {eval_time: 5m, alertname: ShopApiHighErrorRatio, exp_alerts: []}

  - interval: 15s
    input_series:
      - series: 'up{namespace="shop",job="api",pod="a"}'
        values: '1x8 0x20'
      - series: 'up{namespace="shop",job="worker",pod="w"}'
        values: '1x28'
    alert_rule_test:
      - {eval_time: 2m, alertname: ShopApiDown, exp_alerts: []}
      - eval_time: 4m
        alertname: ShopApiDown
        exp_alerts:
          - exp_labels: {severity: critical, service: api, namespace: shop}
            exp_annotations:
              summary: "api: ни одна реплика не отдаёт метрики"
              description: "Prometheus 1m не может снять /metrics ни с одного пода api. Пользователи, скорее всего, не получают ответа вообще; ShopApiHighErrorRatio в этой ситуации молчит — считать долю ошибок не из чего."

  - interval: 15s
    input_series:
      - series: 'up{namespace="shop",job="worker",pod="w"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: ShopApiDown
        exp_alerts:
          - exp_labels: {severity: critical, service: api, namespace: shop}
            exp_annotations:
              summary: "api: ни одна реплика не отдаёт метрики"
              description: "Prometheus 1m не может снять /metrics ни с одного пода api. Пользователи, скорее всего, не получают ответа вообще; ShopApiHighErrorRatio в этой ситуации молчит — считать долю ошибок не из чего."

  - interval: 1m
    input_series:
      - series: 'orders_created_total{namespace="shop",job="api",pod="a"}'
        values: '0+5x15'
      - series: 'orders_processed_total{namespace="shop",job="worker",pod="w"}'
        values: '0+5x4 _x11'
    alert_rule_test:
      - {eval_time: 4m, alertname: ShopOrdersNotProcessed, exp_alerts: []}
      - eval_time: 12m
        alertname: ShopOrdersNotProcessed
        exp_alerts:
          - exp_labels: {severity: warning, service: worker, namespace: shop}
            exp_annotations:
              summary: "заказы создаются, но worker ни одного не обработал"
              description: "За последние 5m api создаёт заказы, а worker не обработал ни одного. api при этом здоров и отвечает 201 — проблему видно только по бизнес-метрикам. Проверь kubectl get deploy worker -n shop и логи worker."

  - interval: 1m
    input_series:
      - series: 'orders_created_total{namespace="shop",job="api",pod="a"}'
        values: '7x15'
      - series: 'orders_processed_total{namespace="shop",job="worker",pod="w"}'
        values: '7x15'
    alert_rule_test:
      - {eval_time: 12m, alertname: ShopOrdersNotProcessed, exp_alerts: []}
