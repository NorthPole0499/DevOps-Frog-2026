apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: monitoring
  labels: {app: alert-webhook, app.kubernetes.io/name: alert-webhook, team: monitoring}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-webhook
  template:
    metadata:
      labels: {app: alert-webhook, app.kubernetes.io/name: alert-webhook, team: monitoring}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: webhook
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_POST(self):
                      length = int(self.headers.get("Content-Length", 0))
                      body = self.rfile.read(length)
                      print("=== ALERTMANAGER WEBHOOK ===", flush=True)
                      print(body.decode("utf-8"), flush=True)
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"OK")

                  def log_message(self, format, *args):
                      return

              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: monitoring
  labels: {app: alert-webhook, app.kubernetes.io/name: alert-webhook, team: monitoring}
spec:
  selector:
    app: alert-webhook
  ports:
    - port: 8080
      targetPort: 8080
