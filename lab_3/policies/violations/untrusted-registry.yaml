apiVersion: v1
kind: Pod
metadata:
  name: untrusted-registry
  labels:
    app.kubernetes.io/name: untrusted-registry
    team: shop
spec:
  containers:
    - name: app
      image: docker.io/library/nginx:1.27
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        runAsNonRoot: true
