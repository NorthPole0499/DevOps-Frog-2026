apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    {{- include "shop.labels" (dict "root" . "name" "worker") | nindent 4 }}
spec:
  selector:
    {{- include "shop.selectorLabels" (dict "root" . "name" "worker") | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
