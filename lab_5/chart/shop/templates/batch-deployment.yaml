apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  labels:
    {{- include "shop.labels" (dict "root" . "name" "batch") | nindent 4 }}
spec:
  replicas: {{ .Values.batch.replicas }}
  strategy:
    type: {{ .Values.batch.strategy }}
    {{- if eq .Values.batch.strategy "Recreate" }}
    rollingUpdate: null
    {{- end }}
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "root" . "name" "batch") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.labels" (dict "root" . "name" "batch") | nindent 8 }}
    spec:
      {{- with include "shop.priorityClassName" (dict "root" . "name" "batch" "key" .Values.batch.priorityClass) }}{{ . | nindent 6 }}{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      terminationGracePeriodSeconds: {{ .Values.batch.terminationGracePeriodSeconds }}
      containers:
        - name: batch
          image: "{{ .Values.batch.image.repository }}:{{ .Values.batch.image.tag }}"
          imagePullPolicy: {{ .Values.batch.image.pullPolicy }}
          env:
            - {name: MEMORY_MB, value: {{ .Values.batch.load.memoryMb | quote }}}
            - {name: CPU_WORKERS, value: {{ .Values.batch.load.cpuWorkers | quote }}}
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
