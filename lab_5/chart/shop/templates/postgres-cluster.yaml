apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shop-postgres
  labels:
    {{- include "shop.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  {{- with include "shop.priorityClassName" (dict "root" . "name" "postgres" "key" .Values.postgres.priorityClass) }}{{ . | nindent 2 }}{{- end }}
  enablePDB: {{ .Values.postgres.pdb.enabled }}
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: shop
      team: {{ .Values.team | quote }}
  storage:
    size: {{ .Values.postgres.storage.size }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
