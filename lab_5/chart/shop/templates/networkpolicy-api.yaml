{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  labels:
    {{- include "shop.labels" (dict "root" . "name" "api") | nindent 4 }}
spec:
  {{- include "shop.netpol.podSelector" (dict "root" . "name" "api") | nindent 2 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- if .Values.client.enabled }}
        - {{ include "shop.netpol.podSelector" (dict "root" . "name" "client") | nindent 10 | trim }}
        {{- end }}
        - {{ include "shop.netpol.peer" $np.prometheus | nindent 10 | trim }}
        {{- if eq .Values.api.service.type "NodePort" }}
        {{- range $np.nodePortClientCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- end }}
      ports:
        - {port: {{ $np.ports.api }}, protocol: TCP}
  egress:
    - to:
        - {{ include "shop.netpol.postgresSelector" . | nindent 10 | trim }}
      ports:
        - {port: {{ $np.ports.postgres }}, protocol: TCP}
{{- end }}
