{{- range $key, $pc := .Values.priorityClasses }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ printf "%s-%s" $.Release.Name $key }}
  labels:
    {{- include "shop.labels" (dict "root" $ "name" $key) | nindent 4 }}
value: {{ $pc.value | int }}
globalDefault: false
preemptionPolicy: {{ $pc.preemptionPolicy }}
description: {{ $pc.description | quote }}
{{- end }}
